launch:
  - arg:
      name: filter_config
      default: "$(find-pkg-share rovio)/cfg/rovio.info"

  - arg:
      name: cam0_config
      default: "$(find-pkg-share rovio)/cfg/euroc_cam0.yaml"

  - arg:
      name: cam1_config
      default: "$(find-pkg-share rovio)/cfg/euroc_cam1.yaml"
  - arg:
      name: imu_topic
      default: "/imu0"
  - arg:
      name: cam0_topic
      default: "/cam0/image_raw"
  - arg:
      name: cam1_topic
      default: "/cam1/image_raw"
  - arg:
      name: resize_image
      default: "false"
  - arg:
      name: resize_image_width
      default: "320"
  - arg:
      name: resize_image_height
      default: "240"
  - arg:
      name: vis_fps
      default: "5"
  - arg:
      name: health_tracker_velocity_threshold
      default: "1.0"
  - arg:
      name: health_tracker_accel_threshold
      default: "0.5"
  - arg:
      name: health_tracker_pixel_cov_threshold
      default: "10.0"
  - arg:
      name: map_frame
      default: "/map"
  - arg:
      name: world_frame
      default: "/world"
  - arg:
      name: camera_frame
      default: "/camera"
  - arg:
      name: imu_frame
      default: "/imu"
  - node:
      pkg: rovio
      exec: rovio_node
      name: rovio
      output: screen
      param:
        - name: filter_config
          value: "$(var filter_config)"
        - name: camera0_config
          value: "$(var cam0_config)"
        - name: camera1_config
          value: "$(var cam1_config)"
        - name: use_sim_time
          value: true
        - name: resize_image
          value: "$(var resize_image)"
        - name: resize_image_width
          value: "$(var resize_image_width)"
        - name: resize_image_height
          value: "$(var resize_image_height)"
        - name: vis_fps
          value: "$(var vis_fps)"
        - name: health_tracker_velocity_threshold
          value: "$(var health_tracker_velocity_threshold)"
        - name: health_tracker_accel_threshold
          value: "$(var health_tracker_accel_threshold)"
        - name: health_tracker_pixel_cov_threshold
          value: "$(var health_tracker_pixel_cov_threshold)"
        - name: map_frame
          value: "$(var map_frame)"
        - name: world_frame
          value: "$(var world_frame)"
        - name: camera_frame
          value: "$(var camera_frame)"
        - name: imu_frame
          value: "$(var imu_frame)"
        - name: cam0_topic
          value: "$(var cam0_topic)"
        - name: cam1_topic
          value: "$(var cam1_topic)"
        - name: imu_topic
          value: "$(var imu_topic)"
  - node:
      pkg: image_view
      exec: image_view
      name: rovio_image_view
      remap:
        - from: image
          to: /rovio/imgVis0

